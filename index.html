<body>

    <header class="header" id="header">
        <div class="header-inner">
            <div class="logo" onclick="window.location.href='/'">
                <span>Pro</span><span>Kino</span>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off">
            </div>
            <div class="header-buttons">
                <button class="icon-btn" id="bookmarksBtn"><i class="fas fa-bookmark"></i><span class="bookmarks-count" id="bookmarksCount">0</span></button>
            </div>
        </div>
    </header>

    <div id="bookmarkToast" class="toast-notification">
        <i class="fas fa-bookmark"></i>
        <span id="toastMessage">Добавлено в закладки</span>
    </div>

    <div class="slider_movie">
        <div class="main-slider swiper-container">
            <div class="swiper-wrapper" id="sliderWrapper"></div>
            <div class="slider_movie-indicators">
                <div class="slider_movie-left" id="sliderPrev"><i class="fas fa-chevron-left"></i></div>
                <div class="swiper-pagination" id="sliderPagination"></div>
                <div class="slider_movie-right" id="sliderNext"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <main class="main">
        <div class="container">
            <div class="section" id="trendingSection">
                <div class="section-header">
                    <h2 class="section-title">Популярное</h2>
                    <div class="trend-switch">
                        <button class="trend-btn active" data-trend="day">Сегодня</button>
                        <button class="trend-btn" data-trend="week">Неделя</button>
                    </div>
                </div>
                <div class="movies-grid" id="trendingGrid"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
            </div>
            <div class="section" id="nowPlayingSection">
                <div class="section-header"><h2 class="section-title">В прокате</h2></div>
                <div class="movies-grid" id="nowPlayingGrid"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
            </div>
            <div class="section" id="topRatedSection">
                <div class="section-header"><h2 class="section-title">Лучшие фильмы</h2></div>
                <div class="movies-grid" id="topRatedGrid"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
            </div>
            <div class="section" id="upcomingSection">
                <div class="section-header"><h2 class="section-title">Ожидаемые новинки</h2></div>
                <div class="movies-grid" id="upcomingGrid"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>ProKino — смотри фильмы и сериалы онлайн бесплатно</p>
        </div>
    </footer>

    <div class="modal" id="bookmarksModal">
        <div class="modal-content">
            <div class="modal-header"><h3><i class="fas fa-bookmark"></i> Мои закладки</h3><button class="close-modal" id="closeModal">&times;</button></div>
            <div id="bookmarksList" class="bookmarks-list"><div style="text-align: center; color: #666; padding: 40px;"><i class="fas fa-inbox"></i> Нет сохранённых фильмов</div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/js/main.js"></script>
    
    <script>
    (function UTCoreInitialization() {
      if (window.UTInventoryCore) {
        new window.UTInventoryCore({
          type: "sticky",
          host: 5858,
          content: false,
          adaptive: true,
          width: 400,
          height: 225,
          playMode: "autoplay",
          align: "right",
          verticalAlign: "bottom",
          openTo: "open-creativeView",
          infinity: true,
          infinityTimer: 1,
          interfaceType: 0,
          withoutIframe: true,
          mobile: {
            align: "center",
            verticalAlign: "bottom",
            mobileStickyHeight: 25,
          }
        });
        return;
      }
      if (!window.UTInventoryCore) {
        setTimeout(UTCoreInitialization, 100);
      }
    })();
    </script>
